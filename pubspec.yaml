name: panoramerge
description: Pure Dart panorama registration, seam finding, and multiband blending for RGB and CMYK rasters.
version: 0.1.0
homepage: https://github.com/focale-editor/panoramerge
repository: https://github.com/focale-editor/panoramerge

environment:
  sdk: '>=3.13.0 <4.0.0'

dev_dependencies:
  analyzer: ^14.3.0
  lints: ^6.1.0
  release: ^0.1.11
  test: ^1.32.0

release:
  changelog:
    header: '# 📰 Panoramerge changelog'
    defaultIgnoredTypes: ['test']
    defaultIgnoredScopes: ['repo', 'docs', 'version', 'deps', 'tools']
